[build]
builder = "DOCKERFILE"
# API + Web service: use default dockerfilePath = "Dockerfile". The API serves
# the built apps/web/dist directory from the same port and origin.
# Worker service: set dockerfilePath = "Dockerfile.worker" in Railway service settings
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck paths by service:
# API + Web: /live (the web app is served at /)
# Worker: /health (also responds to /live and /ready)
healthcheckPath = "/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Service-specific start commands (set in Railway UI if not using separate Dockerfiles):
# API + Web: node apps/api/dist/main.js    (default CMD in Dockerfile)
# Worker:    node apps/worker/dist/main.js (set via Dockerfile.worker CMD or UI override)
